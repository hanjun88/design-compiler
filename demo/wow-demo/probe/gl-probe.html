<!doctype html>
<html><head><meta charset="utf8"><style>html,body{margin:0;background:#000}</style></head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<script>
const gl = document.getElementById('c').getContext('webgl2', {antialias:true});
window.__probe = {};
window.__probe.ok = !!gl;
if (gl) {
  window.__probe.vendor = gl.getParameter(gl.VERSION);
  window.__probe.renderer = 'ANGLE-probe';
  const vs = `#version 300 es
  in vec2 p; out vec2 vUv;
  void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;
  const fs = `#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform vec3 uKey; uniform vec3 uRim; uniform vec3 uDeep;
  void main(){
    // radial "moon" disc lit by key + rim
    vec2 c = vUv - vec2(0.5,0.55);
    float d = length(c);
    float disc = smoothstep(0.42,0.40,d);
    // fake N dot L from key azimuth
    float ndl = max(0.0, dot(normalize(vec3(c,0.5)), normalize(vec3(-0.6,0.5,0.7))));
    // rim: grazing edge from opposite side
    float rim = smoothstep(0.42,0.28,d) * (1.0 - ndl);
    vec3 col = uDeep;
    col = mix(col, uKey, ndl*disc*0.8);
    col += uRim * rim * 0.9;
    col += vec3(0.02);
    o = vec4(col, 1.0);
  }`;
  function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x);
    if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.uniform3fv(gl.getUniformLocation(pr,'uKey'), [0.94,0.88,0.75]);
  gl.uniform3fv(gl.getUniformLocation(pr,'uRim'), [0.79,0.64,0.29]);
  gl.uniform3fv(gl.getUniformLocation(pr,'uDeep'), [0.25,0.09,0.07]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const px = new Uint8Array(480*270*4);
  gl.readPixels(0,0,480,270,gl.RGBA,gl.UNSIGNED_BYTE,px);
  let nonzero=0, sum=0;
  for(let i=0;i<px.length;i+=4){ if(px[i]+px[i+1]+px[i+2]>12) nonzero++; sum+=px[i]+px[i+1]+px[i+2]; }
  window.__probe.nonzero = nonzero;
  window.__probe.avg = Math.round(sum/(px.length/4*3));
}
</script></body></html>
