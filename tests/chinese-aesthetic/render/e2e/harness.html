<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Render Pipeline E2E Harness</title>
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="glcanvas" width="320" height="240" style="width:320px;height:240px;"></canvas>
  <script src="render-pipeline.bundle.js"></script>
  <script>
    // Expose canvas and helpers to Playwright evaluate context
    window.__harness = {
      getCanvas: function() { return document.getElementById('glcanvas'); },
      getBundle: function() { return window.RenderPipeline; },
      createPipeline: function(tier) {
        var canvas = document.getElementById('glcanvas');
        var RP = window.RenderPipeline;
        return new RP.GlPipeline({ canvas: canvas, initialTier: tier || 'WEBGL2' });
      },
      getEnvironment: function() {
        var canvas = document.getElementById('glcanvas');
        var gl = canvas.getContext('webgl2');
        return {
          userAgent: navigator.userAgent,
          webglVersion: gl ? gl.getParameter(gl.VERSION) : null,
          webglVendor: gl ? gl.getParameter(gl.VENDOR) : null,
          webglRenderer: gl ? gl.getParameter(gl.RENDERER) : null,
          shadingLanguageVersion: gl ? gl.getParameter(gl.SHADING_LANGUAGE_VERSION) : null,
          canvasWidth: canvas.width,
          canvasHeight: canvas.height
        };
      }
    };
  </script>
</body>
</html>
