name: DC Test Pipeline

on:
  push:
    branches:
      - master
      - feat/aesthetic-integration
  pull_request:
    branches:
      - master
      - feat/aesthetic-integration

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        node: ["20"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run build

      - name: Run all tests (unit + contract)
        run: npm run test:all
