<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水墨晕染主题切换 · ink-ripple-theme</title>
<!--
  ============================================================
  组件名称：ink-ripple-theme（水墨晕染主题切换）
  中式美学对应：
    · 亮色模式 = 宣纸（生宣）：底色 #f5f0e6，墨色 #2d2a26，纸面细微噪点
    · 暗色模式 = 绢本（熟绢）：底色 #1a1612，墨色 #d4c5a9，暖调微光
    · 晕染 = 墨落纸上的圆形洇散：clip-path: circle() 自触点向外扩散覆盖全屏
  参数说明：
    · 扩散缓动 cubic-bezier(0.4, 0, 0.2, 1) —— 墨色渐渗，先快后缓
    · 最大半径 R = 触点到屏幕四角最远距离（JS 动态计算，保证盖住全屏）
    · 两张页面真实叠放共存（非单纯切换 CSS 变量），上层被圆形裁切；
      裁切只裁剪可见区域，不做任何缩放/位移，故底层文字圆边扫过不变形
  外部依赖：无（纯内联 CSS + 原生 JS，不引用 React/Vue/GSAP）
  ============================================================
-->
<style>
  /* ---------- 基础重置 ---------- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 两张页面：真实共存 ---------- */
  .page {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    /* 晕染扩散动画：仅过渡 clip-path，不动 transform，文字零变形 */
    transition: clip-path 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: clip-path;
  }

  /* 宣纸（亮色） */
  .page--light {
    background-color: #f5f0e6;
    color: #2d2a26;
    /* 纸张噪点纹理（内联 SVG feTurbulence，无外部资源） */
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/></svg>");
    z-index: 1;
  }

  /* 绢本（暗色）：初始裁成按钮处一个点，先藏在下层按钮后面 */
  .page--dark {
    background-color: #1a1612;
    color: #d4c5a9;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/></svg>");
    clip-path: circle(0px at calc(100vw - 44px) 44px);
    z-index: 2;
  }

  /* ---------- 内容排版 ---------- */
  .content {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  .content h1 {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 600;
    letter-spacing: 0.15em;
    margin-bottom: 20px;
  }
  .content p {
    font-size: clamp(15px, 2.4vw, 18px);
    line-height: 2;
    text-align: justify;
    opacity: 0.85;
    margin-bottom: 32px;
  }

  /* ---------- 占位山水画（CSS 渐变模拟远近山峦 + 日月） ---------- */
  .landscape {
    width: 100%;
    height: clamp(180px, 40vw, 280px);
    border-radius: 6px;
    overflow: hidden;
  }
  /* 宣纸山水：淡墨远山、纸底留白 */
  .page--light .landscape {
    background:
      radial-gradient(circle at 72% 26%, rgba(45,42,38,0.18) 0 16px, transparent 17px),  /* 日 */
      linear-gradient(to top, rgba(45,42,38,0.28) 0 22%, transparent 22%),              /* 近山 */
      linear-gradient(to top, rgba(45,42,38,0.16) 0 46%, transparent 46%),             /* 中山 */
      linear-gradient(to top, rgba(45,42,38,0.08) 0 68%, transparent 68%),             /* 远山 */
      linear-gradient(to bottom, #ece5d5, #f5f0e6);
  }
  /* 绢本山水：暖墨夜山、冷月微光 */
  .page--dark .landscape {
    background:
      radial-gradient(circle at 72% 26%, rgba(212,197,169,0.55) 0 14px, transparent 15px), /* 月 */
      linear-gradient(to top, rgba(0,0,0,0.55) 0 22%, transparent 22%),
      linear-gradient(to top, rgba(0,0,0,0.38) 0 46%, transparent 46%),
      linear-gradient(to top, rgba(0,0,0,0.22) 0 68%, transparent 68%),
      linear-gradient(to bottom, #261e16, #1a1612);
  }

  /* ---------- 主题切换按钮（悬浮于两层页面之上） ---------- */
  .toggle-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid currentColor;
    background: transparent;
    color: #2d2a26;                 /* 亮页墨色 */
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    transition: color 0.4s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle-btn:active { transform: scale(0.9); }
  body[data-theme="dark"] .toggle-btn { color: #d4c5a9; }  /* 暗页绢色 */
  .toggle-btn svg { width: 22px; height: 22px; fill: currentColor; }
</style>
</head>
<body data-theme="light">

  <!-- 亮色页：宣纸 -->
  <main class="page page--light" id="pageLight">
    <div class="content">
      <h1>云山清晓</h1>
      <p>
        作画之妙，在于墨分五色。浓墨如焦，淡墨如雾，落纸晕染之间，
        山石云水皆成生意。观者不睹其笔，而见其气；不究其形，而会其神。
        此乃东方写意之境——以有限之黑白，写无限之山川。
      </p>
      <div class="landscape" role="img" aria-label="水墨山水占位图"></div>
    </div>
  </main>

  <!-- 暗色页：绢本 -->
  <main class="page page--dark" id="pageDark">
    <div class="content">
      <h1>云山清晓</h1>
      <p>
        作画之妙，在于墨分五色。浓墨如焦，淡墨如雾，落纸晕染之间，
        山石云水皆成生意。观者不睹其笔，而见其气；不究其形，而会其神。
        此乃东方写意之境——以有限之黑白，写无限之山川。
      </p>
      <div class="landscape" role="img" aria-label="水墨山水占位图"></div>
    </div>
  </main>

  <!-- 切换按钮：墨滴图标 -->
  <button class="toggle-btn" id="toggleBtn" aria-label="切换明暗主题">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2.5c0 0-6.5 7.2-6.5 11.5a6.5 6.5 0 0 0 13 0C18.5 9.7 12 2.5 12 2.5z"/>
    </svg>
  </button>

<script>
(function () {
  'use strict';

  var lightPage = document.getElementById('pageLight');
  var darkPage  = document.getElementById('pageDark');
  var btn       = document.getElementById('toggleBtn');
  var isDark    = false;   // 当前是否处于暗色（绢本）
  var topZ      = 10;      // 顶层 z-index 计数器，把"进来的那一层"抬到最上
  var animating = false;   // 动画期间拦截重复点击

  // 计算触点 (x,y) 到屏幕四角的最远距离，作为圆形扩散半径 R
  function maxRadius(x, y) {
    var w = window.innerWidth;
    var h = window.innerHeight;
    var corners = [[0, 0], [w, 0], [0, h], [w, h]];
    var r = 0;
    for (var i = 0; i < corners.length; i++) {
      var d = Math.hypot(x - corners[i][0], y - corners[i][1]);
      if (d > r) r = d;
    }
    return r;
  }

  // 以触点为圆心，把 incoming 层从半径 0 扩散到半径 R（盖住全屏）
  function reveal(incoming, x, y) {
    var R = maxRadius(x, y);
    incoming.style.zIndex = ++topZ;

    // 关键：先关掉过渡，把"触点处 0 半径"这一帧直接落定，
    // 避免从上一次的大半径状态回退产生反方向动画。
    incoming.style.transition = 'none';
    incoming.style.clipPath = 'circle(0px at ' + x + 'px ' + y + 'px)';
    void incoming.offsetWidth;            // 强制回流，提交起始态

    // 恢复过渡，再展开到全屏半径，触发 0.85s 的晕染扩散
    incoming.style.transition = '';
    incoming.style.clipPath = 'circle(' + R + 'px at ' + x + 'px ' + y + 'px)';
  }

  function handleClick(e) {
    if (animating) return;
    animating = true;
    setTimeout(function () { animating = false; }, 900);

    // 取触点坐标；兜底用按钮中心
    var x = (e.clientX != null) ? e.clientX : window.innerWidth - 44;
    var y = (e.clientY != null) ? e.clientY : 44;

    if (!isDark) {
      // 亮(宣纸) -> 暗(绢本)：暗色层自触点扩散
      reveal(darkPage, x, y);
      document.body.dataset.theme = 'dark';
      isDark = true;
    } else {
      // 暗(绢本) -> 亮(宣纸)：亮色层自触点扩散
      reveal(lightPage, x, y);
      document.body.dataset.theme = 'light';
      isDark = false;
    }
  }

  btn.addEventListener('click', handleClick);
})();
</script>
</body>
</html>
