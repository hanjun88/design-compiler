<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>册页视差卡片 · album-parallax-card</title>
<!--
  ============================================================================
  组件名称：册页视差卡片（album-parallax-card）
  ----------------------------------------------------------------------------
  中式美学对应：
    1. 册页/卷轴景深层次 —— 远景山水（背景层）、中景诗句（内容层）、
       近景印章（前景层）三层错位，模拟翻阅册页时的景深。
    2. 漆器/玉石温润反光 —— 高光层为径向渐变，随指针角度在卡片表面流动，
       离开时平滑淡出，形成"包浆"般的柔光。
    3. 宣纸底色 #f5f0e6，墨色 #2d2a26，朱砂印章红 #b23a2e。
  ----------------------------------------------------------------------------
  参数说明（JS 顶部常量）：
    MAX_TILT   卡片最大倾斜角度（度），限制 ±12°，避免过度翻转。
    AMP        图层视差位移振幅（px），实际位移 = AMP × 层级系数。
    PARALLAX   各层视差系数：背景 0.3（动得最少，最远）、
               内容 0.6（中等）、印章 1.0（动得最多，最近）。
    DEPTH_Z    各层 translateZ 深度（px），配合 preserve-3d 产生真实立体层距。
    RESET_MS   指针离开后复位时长（对应 transition 0.5s ease-out）。
  ----------------------------------------------------------------------------
  技术要点：纯 CSS 3D（perspective + preserve-3d）+ Pointer Events
  （pointermove 统一鼠标/触摸），无任何外部依赖。
  ============================================================================
-->
<style>
  /* ---------- 全局与舞台 ---------- */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 舞台背景：略深于宣纸，衬托册页 */
    background: linear-gradient(160deg, #d8d0bd 0%, #c4bba4 100%);
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    overflow: hidden;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* ---------- 3D 视口：perspective 加在外层 ---------- */
  .card-wrap {
    perspective: 1100px;              /* 观察者到卡片的距离，决定 3D 强弱 */
    /* 触摸时禁止浏览器默认滚动/缩放手势，保证 touchmove 可用 */
    touch-action: none;
    cursor: pointer;
  }

  .card {
    position: relative;
    width: min(340px, 86vw);
    aspect-ratio: 340 / 480;          /* 册页竖版比例 */
    border-radius: 10px;
    background-color: #f5f0e6;        /* 宣纸底色 */
    color: #2d2a26;                   /* 墨色 */
    transform-style: preserve-3d;     /* 关键：子图层在 3D 空间内分层 */
    transform: rotateX(0deg) rotateY(0deg);
    box-shadow:
      0 30px 60px -18px rgba(45, 42, 38, 0.45),
      0 4px 12px rgba(45, 42, 38, 0.15);
    overflow: hidden;
  }

  /* 卡片四边的淡墨描边，模拟册页装裱 */
  .card::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(45, 42, 38, 0.25);
    border-radius: 4px;
    pointer-events: none;
  }

  /* ---------- 通用图层：绝对定位，略放大以防视差位移露底 ---------- */
  .layer {
    position: absolute;
    inset: -24px;
    pointer-events: none;
    border-radius: 10px;
  }

  /* ---------- 远景层：CSS 渐变模拟山水（最远，动得最少） ---------- */
  .layer-bg {
    /* 多层径向渐变叠加：远近山峦的墨色晕染 */
    background:
      /* 远山（最淡） */
      radial-gradient(ellipse 90% 30% at 25% 88%, rgba(45,42,38,0.18), transparent 70%),
      radial-gradient(ellipse 70% 22% at 75% 92%, rgba(45,42,38,0.14), transparent 70%),
      /* 近坡（稍浓） */
      radial-gradient(ellipse 120% 26% at 50% 104%, rgba(45,42,38,0.22), transparent 70%),
      /* 顶部留白的天光 */
      linear-gradient(to bottom, rgba(255,255,255,0.35), transparent 45%);
  }

  /* 宣纸纤维纹理（极淡） */
  .layer-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(45, 42, 38, 0.02) 0px,
      rgba(45, 42, 38, 0.02) 1px,
      transparent 1px,
      transparent 4px
    );
  }

  /* ---------- 中景层：竖排唐诗 ---------- */
  .layer-content {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;        /* 竖排文字从右侧起列 */
    padding: 48px 44px 48px 24px;
  }

  .poem {
    writing-mode: vertical-rl;        /* 竖排：从上到下，列从右到左 */
    text-orientation: upright;
    letter-spacing: 0.35em;
    font-size: 19px;
    line-height: 1.9;
    color: #2d2a26;
  }

  .poem .title {
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(45, 42, 38, 0.75);
    margin-right: 1.2em;             /* 题目与正文列之间的间距 */
  }

  /* ---------- 前景层：朱砂印章（最近，动得最多） ---------- */
  .layer-seal {
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 0 0 56px 48px;           /* 印章落在左下，传统落款位置 */
  }

  .seal {
    width: 64px;
    height: 64px;
    filter: drop-shadow(0 3px 4px rgba(45, 42, 38, 0.25));
    /* 印章轻微歪斜，更具手钤质感 */
    transform: rotate(-4deg);
  }

  /* ---------- 高光层：温润反光，随指针流动 ---------- */
  .layer-highlight {
    opacity: 0;                       /* 离开时淡出，进入时点亮 */
    transition: opacity 0.4s ease;
    /* --hx / --hy 由 JS 写入（百分比） */
    background: radial-gradient(
      220px circle at var(--hx, 50%) var(--hy, 50%),
      rgba(255, 255, 255, 0.55),
      rgba(255, 255, 255, 0.15) 35%,
      transparent 65%
    );
    mix-blend-mode: soft-light;       /* 柔光混合，像漆器包浆反光 */
  }

  .card.is-hovered .layer-highlight {
    opacity: 1;
  }

  /* ---------- 下方标注 ---------- */
  .caption {
    font-size: 14px;
    letter-spacing: 0.2em;
    color: rgba(45, 42, 38, 0.6);
  }
</style>
</head>
<body>
  <div class="stage">
    <!-- 3D 视口包裹层 -->
    <div class="card-wrap" id="cardWrap">
      <!-- 卡片本体：JS 控制其 rotateX/rotateY -->
      <div class="card" id="card">
        <!-- 远景：山水 -->
        <div class="layer layer-bg" id="layerBg"></div>

        <!-- 中景：竖排唐诗（王维《山居秋暝》） -->
        <div class="layer layer-content" id="layerContent">
          <div class="poem">
            <span class="title">山居秋暝</span>
            <span>空山新雨后天气晚来秋明月松间照清泉石上流</span>
          </div>
        </div>

        <!-- 前景：朱砂印章 SVG -->
        <div class="layer layer-seal" id="layerSeal">
          <svg class="seal" viewBox="0 0 100 100" aria-label="闲章">
            <!-- 印面 -->
            <rect x="3" y="3" width="94" height="94" rx="8" fill="#b23a2e"/>
            <!-- 内框 -->
            <rect x="11" y="11" width="78" height="78" rx="4"
                  fill="none" stroke="#f5f0e6" stroke-width="3"/>
            <!-- 印文：闲章 -->
            <text x="50" y="62" text-anchor="middle"
                  font-family="Songti SC, SimSun, serif"
                  font-size="44" fill="#f5f0e6">閑</text>
          </svg>
        </div>

        <!-- 高光层（最后绘制，浮于最上） -->
        <div class="layer layer-highlight" id="layerHighlight"></div>
      </div>
    </div>

    <p class="caption">册页视差 · 移动鼠标查看景深</p>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== 参数配置 ===================== */
  var MAX_TILT = 12;      // 最大倾斜角度（±度）
  var AMP = 16;           // 视差位移振幅（px）
  var RESET_MS = 500;     // 复位时长 ms（0.5s ease-out）

  // 各层视差系数与 3D 深度：越远的层系数越小、Z 越浅
  var LAYERS = [
    { el: document.getElementById("layerBg"),      factor: 0.3, z: 0 },
    { el: document.getElementById("layerContent"),  factor: 0.6, z: 35 },
    { el: document.getElementById("layerSeal"),    factor: 1.0, z: 70 }
  ];

  /* ===================== 元素引用 ===================== */
  var wrap = document.getElementById("cardWrap");
  var card = document.getElementById("card");

  // 当前是否处于"按下/触摸移动"状态（用于 rAF 节流）
  var rafId = null;
  // 待处理的指针归一化坐标（-1 ~ 1）
  var pending = { nx: 0, ny: 0, px: 0.5, py: 0.5 };

  /* ===================== 核心：根据指针位置渲染 ===================== */
  function render() {
    rafId = null;
    var nx = pending.nx;   // -1（左）~ 1（右）
    var ny = pending.ny;    // -1（上）~ 1（下）

    // 卡片整体倾斜：左右摆动绕 Y 轴，上下摆动绕 X 轴
    card.style.transform =
      "rotateX(" + (-ny * MAX_TILT).toFixed(2) + "deg) " +
      "rotateY(" + ( nx * MAX_TILT).toFixed(2) + "deg)";

    // 高光位置：相对卡片左上角的百分比
    card.style.setProperty("--hx", (pending.px * 100).toFixed(1) + "%");
    card.style.setProperty("--hy", (pending.py * 100).toFixed(1) + "%");

    // 各层反向位移：与倾斜方向相反，产生"看进去"的景深
    // 位移量 = AMP × 层级系数，Z 方向拉开真实层距
    for (var i = 0; i < LAYERS.length; i++) {
      var L = LAYERS[i];
      var dx = -nx * AMP * L.factor;
      var dy = -ny * AMP * L.factor;
      L.el.style.transform =
        "translate3d(" + dx.toFixed(2) + "px, " + dy.toFixed(2) + "px, " + L.z + "px)";
    }
  }

  /* ===================== 指针事件处理 ===================== */
  function handleMove(clientX, clientY) {
    var rect = card.getBoundingClientRect();
    // 指针在卡片内的归一化坐标
    var px = (clientX - rect.left) / rect.width;   // 0 ~ 1
    var py = (clientY - rect.top) / rect.height;
    pending.px = px;
    pending.py = py;
    pending.nx = px * 2 - 1;
    pending.ny = py * 2 - 1;

    // 进入活动状态：关闭过渡，跟随即时响应
    card.classList.add("is-hovered");
    setTransition("none");

    // rAF 节流，保证流畅
    if (rafId === null) {
      rafId = requestAnimationFrame(render);
    }
  }

  // 统一监听 pointermove：同时覆盖鼠标与触摸
  wrap.addEventListener("pointermove", function (e) {
    handleMove(e.clientX, e.clientY);
  });

  // 指针离开（或触摸结束）：平滑复位
  function reset() {
    card.classList.remove("is-hovered");
    setTransition("transform " + (RESET_MS / 1000) + "s ease-out");

    card.style.transform = "rotateX(0deg) rotateY(0deg)";
    for (var i = 0; i < LAYERS.length; i++) {
      var L = LAYERS[i];
      L.el.style.transform = "translate3d(0px, 0px, " + L.z + "px)";
    }
    card.style.setProperty("--hx", "50%");
    card.style.setProperty("--hy", "50%");

    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  wrap.addEventListener("pointerleave", reset);
  wrap.addEventListener("pointerup", reset);
  wrap.addEventListener("pointercancel", reset);

  /* 统一设置/清除所有层的 transition */
  function setTransition(value) {
    card.style.transition = value;
    for (var i = 0; i < LAYERS.length; i++) {
      LAYERS[i].el.style.transition = value;
    }
  }
})();
</script>
</body>
</html>
