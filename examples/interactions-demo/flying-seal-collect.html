<!--
  组件名称：飞白钤印收藏
  中式美学对应：
    - 飞白笔触：克隆山水画沿二次贝塞尔弧线飞行，末端透明度渐隐（opacity 1→0.3）并轻微模糊，模拟干笔飞白渐枯效果
    - 钤印：印章落纸瞬间按钮震动缩放（scale 1→1.3→1）并微旋（rotate 0°→-3°→0°），模拟盖印力道与回弹
    - 朱砂红 #b33a3a 印章，宣纸底 #f5f0e6 页面，墨色 #2d2a26 文字
  参数说明：
    - 飞行时长：600ms，ease-in 缓动（t² 先慢后快）
    - 飞行缩放：主图克隆从 1 缩小到 0.2（20%）
    - 飞行透明度：1 → 0.3（飞白渐隐）
    - 飞行轨迹：二次贝塞尔曲线，控制点向右上偏移形成弧线
    - 钤印动画：300ms spring 缓动（cubic-bezier 回弹）
    - 角标弹动：scale 1→1.5→1，300ms
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞白钤印收藏</title>
<style>
/* ===== 全局重置与基础 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f5f0e6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", serif;
  color: #2d2a26;
  padding: 20px;
  overflow: hidden;
}

/* ===== 山水画主图（CSS 渐变模拟：远山 + 近水 + 淡日） ===== */
.painting {
  width: min(78vw, 340px);
  height: min(56vw, 250px);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
  /* 多层渐变叠加，从底层宣纸到顶层远山 */
  background:
    /* 淡日：暖白偏黄的圆形光晕 */
    radial-gradient(circle at 68% 26%,
      rgba(215, 180, 135, 0.42) 0%,
      rgba(215, 180, 135, 0.14) 38%,
      transparent 62%),
    /* 远山第一层（最远最淡） */
    linear-gradient(172deg,
      transparent 42%,
      #cfc9bc 42%,
      #c5bfb2 56%,
      transparent 56%),
    /* 远山第二层 */
    linear-gradient(188deg,
      transparent 48%,
      #bdb7aa 48%,
      #b0aa9d 62%,
      transparent 62%),
    /* 近山第一层（墨色稍重） */
    linear-gradient(160deg,
      transparent 58%,
      #8a8478 58%,
      #6e685e 76%,
      transparent 76%),
    /* 近山第二层（最深） */
    linear-gradient(195deg,
      transparent 66%,
      #7a746a 66%,
      #5c564e 82%,
      transparent 82%),
    /* 近水：底部水面反光 */
    linear-gradient(to top,
      #ddd8cc 0%,
      #d6d1c5 50%,
      transparent 100%),
    /* 宣纸底色（最底层） */
    linear-gradient(to bottom,
      #f0e9db 0%,
      #ebe4d6 100%);
  box-shadow: 0 2px 16px rgba(45, 42, 38, 0.12);
}

/* 画中飞鸟剪影（装饰细节） */
.painting::after {
  content: '';
  position: absolute;
  top: 22%;
  right: 24%;
  width: 18px;
  height: 5px;
  border-top: 1.5px solid rgba(45, 42, 38, 0.3);
  border-radius: 50%;
}

/* ===== 印章形收藏按钮（方形圆角，朱砂红底） ===== */
.seal-btn {
  margin-top: 36px;
  width: 68px;
  height: 68px;
  background: #b33a3a;
  border: none;
  border-radius: 8px;
  position: relative;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 印章质感：内描边 + 底部暗边 + 红色投影 */
  box-shadow:
    inset 0 0 0 2px rgba(245, 240, 230, 0.2),
    inset 0 -3px 6px rgba(0, 0, 0, 0.15),
    0 4px 14px rgba(179, 58, 58, 0.35);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.seal-text {
  color: #f5f0e6;
  font-size: 30px;
  font-weight: bold;
  line-height: 1;
}

/* ===== 角标（按钮右上角红色圆形数字） ===== */
.badge {
  position: absolute;
  top: -8px;
  right: -8px;
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  background: #8b2525;
  color: #f5f0e6;
  border-radius: 11px;
  font-size: 12px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #f5f0e6;
  font-family: "Helvetica Neue", Arial, sans-serif;
}

/* ===== 钤印动画：印章落纸震动（scale 1→1.3→1，rotate 0→-3°→0°） ===== */
@keyframes stampDown {
  0%   { transform: scale(1)     rotate(0deg); }
  45%  { transform: scale(1.3)   rotate(-3deg); }
  100% { transform: scale(1)     rotate(0deg); }
}
.seal-btn.stamping {
  animation: stampDown 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ===== 角标弹性缩放动画（scale 1→1.5→1） ===== */
@keyframes badgePop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.5); }
  100% { transform: scale(1); }
}
.badge.popping {
  animation: badgePop 0.3s ease-out;
}

/* ===== 飞行克隆元素（飞白轨迹载体） ===== */
.fly-clone {
  position: fixed;
  left: 0;
  top: 0;
  pointer-events: none;
  z-index: 9999;
  margin: 0;
  will-change: transform, opacity;
}

/* ===== 底部标注文字 ===== */
.annotation {
  margin-top: 36px;
  font-size: 14px;
  color: rgba(45, 42, 38, 0.5);
  letter-spacing: 3px;
}
</style>
</head>
<body>

  <!-- 山水画主图：点击时被克隆并沿弧线飞向印章 -->
  <div class="painting" id="painting"></div>

  <!-- 印章收藏按钮：点击触发飞白钤印动画 -->
  <button class="seal-btn" id="sealBtn" type="button" aria-label="收藏">
    <span class="seal-text">藏</span>
    <!-- 收藏数量角标 -->
    <span class="badge" id="badge">0</span>
  </button>

  <!-- 底部标注 -->
  <p class="annotation">飞白钤印 · 点击印章收藏</p>

<script>
(function () {
  'use strict';

  /* ===== DOM 元素引用 ===== */
  var painting = document.getElementById('painting');  // 山水画主图
  var sealBtn  = document.getElementById('sealBtn');    // 印章收藏按钮
  var badge    = document.getElementById('badge');      // 角标数字

  /* ===== 状态变量 ===== */
  var count = 0;         // 收藏计数
  var isFlying = false;  // 飞行锁：防止动画未完成时重复触发

  /* ===== 动画参数（与文件头部注释一致） ===== */
  var FLY_DURATION   = 600;   // 飞行时长 0.6s
  var FLY_SCALE_END  = 0.2;   // 缩小到 20%
  var FLY_OPACITY_END = 0.3;  // 透明度渐隐至 0.3（飞白效果）
  var ARC_OFFSET_X   = 90;    // 贝塞尔控制点水平偏移（弧线弧度）
  var ARC_OFFSET_Y   = -70;   // 贝塞尔控制点垂直偏移（向上拱起）

  /* ===== 绑定点击事件（移动端 touch 兼容：click 事件在触屏上自动触发） ===== */
  sealBtn.addEventListener('click', onSealClick);

  /**
   * 印章点击回调：触发飞白飞行动画
   */
  function onSealClick() {
    if (isFlying) return;  // 动画进行中忽略重复点击
    isFlying = true;
    flyToSeal();
  }

  /**
   * 飞白钤印核心：克隆主图沿二次贝塞尔曲线飞向印章
   * 二次贝塞尔公式：B(t) = (1-t)²·P0 + 2(1-t)t·P1 + t²·P2
   *   P0 = 起点（主图中心）
   *   P1 = 控制点（偏移形成弧线）
   *   P2 = 终点（印章按钮中心）
   */
  function flyToSeal() {
    // 获取主图与按钮的视口位置
    var paintRect = painting.getBoundingClientRect();
    var btnRect   = sealBtn.getBoundingClientRect();

    // P0 飞行起点：主图中心坐标
    var startX = paintRect.left + paintRect.width / 2;
    var startY = paintRect.top  + paintRect.height / 2;

    // P2 飞行终点：印章按钮中心坐标
    var endX = btnRect.left + btnRect.width / 2;
    var endY = btnRect.top  + btnRect.height / 2;

    // P1 贝塞尔控制点：中点向右上偏移，形成飞白弧线
    var ctrlX = (startX + endX) / 2 + ARC_OFFSET_X;
    var ctrlY = Math.min(startY, endY) + ARC_OFFSET_Y;

    // 深拷贝克隆主图元素（包含伪元素样式由 CSS class 自动继承）
    var clone = painting.cloneNode(true);
    clone.id = '';               // 清除 id 避免与原元素冲突
    clone.classList.add('fly-clone');
    clone.style.width  = paintRect.width + 'px';
    clone.style.height = paintRect.height + 'px';
    document.body.appendChild(clone);

    // 缓存半宽半高，用于将克隆元素中心对齐贝塞尔路径点
    var halfW = paintRect.width / 2;
    var halfH = paintRect.height / 2;

    var startTime = performance.now();

    /* ===== requestAnimationFrame 逐帧驱动贝塞尔路径动画 ===== */
    function animateFrame(now) {
      var elapsed = now - startTime;
      var t = Math.min(elapsed / FLY_DURATION, 1);  // 归一化进度 0→1

      // ease-in 缓动：t² 先慢后快，符合飞笔加速感
      var et = t * t;

      // 二次贝塞尔曲线坐标计算
      var u = 1 - et;
      var x = u * u * startX + 2 * u * et * ctrlX + et * et * endX;
      var y = u * u * startY + 2 * u * et * ctrlY + et * et * endY;

      // 飞行中从原始尺寸缩小到 20%
      var scale = 1 - (1 - FLY_SCALE_END) * et;

      // 飞白渐隐：透明度从 1 递减到 0.3
      var opacity = 1 - (1 - FLY_OPACITY_END) * et;

      // 末端轻微高斯模糊，模拟干笔飞白的枯笔质感
      var blur = et * 2;

      // 设置克隆元素变换：中心对齐路径点 + 缩放
      clone.style.transform =
        'translate(' + (x - halfW) + 'px,' + (y - halfH) + 'px) scale(' + scale + ')';
      clone.style.opacity = opacity;
      clone.style.filter = 'blur(' + blur + 'px)';

      if (t < 1) {
        // 动画未结束，继续下一帧
        requestAnimationFrame(animateFrame);
      } else {
        // 飞行结束：移除克隆节点，触发钤印与角标
        document.body.removeChild(clone);
        onArrived();
      }
    }

    requestAnimationFrame(animateFrame);
  }

  /**
   * 飞行到达后：钤印落纸动画 + 角标数字 +1 弹性缩放
   */
  function onArrived() {
    // —— 钤印动画：按钮落纸震动 ——
    sealBtn.classList.remove('stamping');
    void sealBtn.offsetWidth;  // 强制重绘，重启 CSS 动画
    sealBtn.classList.add('stamping');

    // —— 角标计数 +1 ——
    count++;
    badge.textContent = count;

    // —— 角标弹性缩放动画 ——
    badge.classList.remove('popping');
    void badge.offsetWidth;    // 强制重绘，重启动画
    badge.classList.add('popping');

    // 释放飞行锁，允许下一次点击
    isFlying = false;
  }

})();
</script>
</body>
</html>
