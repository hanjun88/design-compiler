  card: cards/autonomic-ladder.md
  frontmatter:
    description: 用三梯级状态机给"我现在怎么了"命名：顶梯腹侧(安全/可连接)、中梯交感(战逃/紧绷)、底梯背侧(麻木/崩溃)。先问身体感觉再定位。三态都适应性，腹侧不是唯一好状态；理论有争议，作临床启发式地图用。
