  is_actionable: true
  confidence: 0.75
  card: cards/dorsal-climb-through-sympathetic.md
  frontmatter:
    description: 处于背侧麻木/崩溃时，不能直接"深呼吸放松/想开心的事"回到腹侧（会失败）。两步：先最小身体动作（起身走两步/冷水拍腕/说出5种颜色）升到交感，再延长呼气接地升到腹侧。只对背侧成立。
