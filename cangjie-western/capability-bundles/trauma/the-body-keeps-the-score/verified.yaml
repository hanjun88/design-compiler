# Capability Bundle — The Body Keeps the Score (Bessel van der Kolk, 2014)
# v2.5 唯一编译事实源 (ADR-002)。
# 底本性质: 合法开放同主题权威底本 (SAMHSA TIP57 public domain + PMC 开放获取论文)，非目标商业畅销书全文。
schema_version: 1
bundle_id: bundle.the-body-keeps-the-score
book:
  title: "The Body Keeps the Score: Brain, Mind, and Body in the Healing of Trauma"
  author: "Bessel van der Kolk"
  source_pack: "legal-open-substitute"
  baseline_tag: "SAMHSA-TIP57-2014 + PMC open-access papers on somatic/interoceptive trauma therapy"

entry:
  name: body-keeps-the-score-recovery
  description: >
    创伤的躯体印记与多模式康复入口。覆盖创伤如何改变大脑 (杏仁核/海马/前额叶)、躯体记忆的
    神经生物学基础、创伤与依恋的交互、创伤康复多路径 (EMDR/瑜伽/正念/传感器官/创意治疗)、
    躯体首发信号识别、近端风险筛查、创伤后预防五原则、生活质量重建。所有能力均为心理教育与
    康复路径向导，不替代精神科诊断、药物治疗与急诊。
  core_principles:
    - "身体记住创伤：创伤不只在脑中，更刻在自主神经与躯体症状里。"
    - "先稳定后加工：急性危机/高不稳定期先做情绪调节与安全，再上暴露或 EMDR。"
    - "躯体优先于叙事：对无法用语言言说的创伤，躯体取向是必要补充。"
    - "去病理化：脑三改变是适应代价，不是性格缺陷；风险因子≠个人过错。"
    - "支持性关系是疗愈因子：早期背叛破坏依恋，但安全联结本身就是康复路径。"
  out_of_scope:
    - "不做精神科诊断、不替代药物处方与面诊。"
    - "不自行选择/实施创伤疗法——一线/辅助路径选择需持牌治疗师指导。"
    - "不把所有躯体症状归因于创伤；红旗体征先器质排查。"
  stop_conditions:
    - "出现自伤/自杀意念、解离失控、现实暴力威胁或精神科急症时，立即停止自助流程并转专业危机干预。"

router_entry:
  name: bks-source-router
  description: >
    van der Kolk《The Body Keeps the Score》方法论来源路由：当用户报告创伤后躯体症状、
    脑反应过度、信任困难、治疗选择困惑或创伤后长期功能受损时，按主题路由到对应能力卡。

promotion_budget: 8

capabilities:
  - capability_id: cap.the-body-keeps-the-score.body-memory
    revision: 1
    status: active
    slug: body-memory
    title: "躯体记忆：身体记住创伤的神经生物学核心论题"
    importance: critical
    importance_rationale: >
      本书核心论题 (van der Kolk 1996 直接被引于 NBK207192 L00037)；脑三改变 (L00192-L00193)
      + 躯体化外显 (L00233-L00245) 构成全书理论底座，决定"为何必须躯体介入康复"。
    one_liner: "创伤不只记在脑子里，更刻在身体里；康复必须同时作用于躯体、自主神经与叙事。"
    intents:
      - "为什么我明明知道现在安全了，身体还是发抖/睡不着/像惊弓之鸟"
      - "胸口一直堵着但医生说心脏没问题，是身体问题还是心理问题"
      - "理解创伤如何改变大脑和身体"
    keywords: [body memory, 躯体记忆, 身体记住, amygdala, hippocampus, prefrontal cortex, somatic, van der Kolk]
    also_read:
      - cap.the-body-keeps-the-score.brain-body-loop
      - cap.the-body-keeps-the-score.somatic-first
      - cap.the-body-keeps-the-score.multi-modal-recovery
      - cap.complex-ptsd.four-f-trauma-typology
      - cap.waking-the-tiger.biological-completion
    card: cards/body-memory.md
    frontmatter:
      description: >
        当用户报告"知道现在安全但身体不相信"——失眠/惊跳/慢性疼痛/胸闷/胃肠问题但器查正常，
        或想理解创伤如何改变大脑与身体时使用。解释脑三改变 (杏仁核↑/前额叶↓/海马↓) 与躯体化外显，
        推动躯体优先而非纯谈话的康复取向。红旗体征先器质排查；不替代医疗诊断。
      tags: [trauma, body-memory, neurobiology, somatic, van-der-kolk]
    source_evidence:
      - source_id: SAMHSA-TIP57-NBK207192
        version_id: "2014"
        location: "raw/full_text_open/NBK207192_numbered.txt L00037-L00245"
      - source_id: PMC12154529
        version_id: "2024"
        location: "raw/legal_open/oa_papers/PMC12154529.txt"
    promotion:
      destination: promoted
      gate: { independent_intent: true, independent_contract: true, independent_run: true, independent_reuse: true, independent_eval: true }
      notes: "全书核心论题卡；跨书互链 CPTSD 4F 与 Waking the Tiger 躯体体验。"

  - capability_id: cap.the-body-keeps-the-score.brain-body-loop
    revision: 1
    status: active
    slug: brain-body-loop
    title: "脑-身创伤回路识别（杏仁核/前额叶/海马三改变）"
    importance: high
    importance_rationale: >
      NBK207192 L00192-L00193 程序抽取行号；神经机制是"身体记住创伤"的底层证据，决定去责备化解释框架。
    one_liner: "用杏仁核过度激活/前额叶下线/海马萎缩解释过度警觉与情绪刹车失灵。"
    intents:
      - "他为什么总像惊弓之鸟"
      - "怎么解释创伤后的过度反应"
    keywords: [amygdala, hippocampus, prefrontal cortex, hypervigilance, 脑, neuroimaging]
    also_read:
      - cap.the-body-keeps-the-score.body-memory
      - cap.the-body-keeps-the-score.somatic-first
      - cap.complex-ptsd.optimal-arousal-window
