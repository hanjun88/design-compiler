    one_liner: "查不出原因的身体疼，先并行排查器质与心理，避免'装病'误判。"
    intents:
      - "查不出原因的身体疼"
      - "心慌是身体问题还是心理问题"
    keywords: [somatic, 躯体化, pain, 疼痛, sleep, 睡眠, psychosomatic, 身心, 躯体症状]
    also_read:
