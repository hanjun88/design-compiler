    frontmatter:
      description: >
        当用户或伴侣报告创伤后过度警觉、一点就炸、想停停不下来、回忆像现在发生时使用。
        用脑三改变 (杏仁核警报↑/前额叶刹车↓/海马情境化↓) 做去责备化心理教育。
        不做个体脑成像诊断断言；不替代器质排查。
      tags: [neuroscience, amygdala, hypervigilance, psychoeducation]
    source_evidence:
