  - capability_id: cap.the-body-keeps-the-score.trauma-attachment
    revision: 1
    status: active
    slug: trauma-attachment
    title: "创伤与依恋的交互：早期背叛如何重塑信任能力"
    importance: high
    importance_rationale: >
      NBK207191 L102 (背叛破坏依恋) + L106 (童年虐待者脑脊液催产素降低) + L43 (创伤性联结/Stockholm)
      三处互证；van der Kolk 强调关系性创伤对依恋发展的核心影响。
    one_liner: "当照料者本身是创伤来源，信任系统被劫持；支持性关系本身就是疗愈因子。"
    intents:
      - "我知道他对我不好但就是离不开/恨不起来"
      - "我谁都不信，包括对我好的人"
      - "童年被父母伤害，现在不知道怎么相信任何人"
    keywords: [attachment, 依恋, betrayal, 背叛, oxytocin, 催产素, traumatic bonding, 创伤性联结, trust]
    also_read:
      - cap.the-body-keeps-the-score.body-memory
      - cap.complex-ptsd.relationship-reenactment
      - cap.complex-ptsd.avoidance-support-rebuild
    card: cards/trauma-attachment.md
    frontmatter:
      description: >
        当用户报告童年/关系内创伤 + 信任困难、亲密矛盾、对施害者矛盾忠诚时使用。
        解释早期背叛如何劫持依恋系统、降低催产素、产生创伤性联结，并指出安全关系本身就是疗愈因子。
        现实暴力进行中不催促离开也不要求留下；不替代专业创伤治疗。
      tags: [attachment, betrayal, oxytocin, trust, relationship]
    source_evidence:
      - source_id: SAMHSA-TIP57-NBK207191
        version_id: "2014"
        location: "raw/full_text_open/NBK207191_numbered.txt L00043-L00106"
    promotion:
