    importance: high
    importance_rationale: >
      NBK207192 L00387-L00450 + L00483-L00484 覆盖一线 (TF-CBT/EMDR)、二线 (正念/情绪调节)、
      补充 (瑜伽/针灸/艺术/传感器官) 完整路径谱；直接回应用户"哪种治疗有效/瑜伽有用吗"。
    one_liner: "一线 TF-CBT/EMDR 疗效相当；先稳定化再加工；躯体/创意治疗是补充非替代。"
    intents:
      - "EMDR 有用吗/瑜伽冥想能治创伤吗/哪种心理治疗最有效"
      - "做了几年谈话治疗但身体还是紧，还有别的办法吗"
