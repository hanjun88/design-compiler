  is_actionable: true
  confidence: 0.75
  card: cards/step-back-protocol.md
  frontmatter:
    description: 当发现自己被愤怒/评判/焦虑接管时，命名干扰它、感谢它、礼貌请它退到旁边旁观（不是命令压制），等身体松开、声音变软再继续。语气必须是感谢+请求；不强迫退后。
