schema_version: '1'
bundle_id: bundle.internal-family-systems
entry:
  name: internal-family-systems-entry
  description: 'Internal Family Systems Therapy 方法论能力入口。覆盖次人格系统地图(Manager/Firefighter/Exile)、Self
    的 8C 品质在场检测、Step-back 退让协议、无坏部分假设、接近流亡者前的保护者许可、流亡者卸载协议、与保护者谈判新角色。所有能力均为自我理解与关系/情绪调节向导，不替代专业诊断与治疗。

    '
  core_principles:
  - 先安全后探索：现实危险或自伤/自杀危机永远优先于任何自我调节步骤。
  - 去病理化：心理/创伤反应是对经历的正常适应代价，不是性格缺陷。
  - 关系是过程不是标签：依恋风格/创伤反应是倾向连续谱，非终身判决。
  - 小步慢恢复：不因一次崩溃自我攻击，允许two steps forward one step back。
  out_of_scope:
  - 不做精神科诊断、不替代药物处方与面诊。
  - 现实暴力/家暴进行中不建议自我调节，立即转安全计划与紧急联络。
  - 不凭一次对话贴人格/依恋标签。
  stop_conditions:
  - 出现自伤/自杀意念、解离失控、现实暴力威胁或精神科急症时，立即停止自助流程并转专业危机干预。
router_entry:
  name: internal-family-systems-source-router
  description: 'Richard C. Schwartz《Internal Family Systems Therapy》方法论来源路由：当用户说''我内心有个声音''、被情绪/自我攻击接管、想停止自我批评、或想安全地接触痛苦记忆时，按症状/问题路由到对应能力卡。

    '
