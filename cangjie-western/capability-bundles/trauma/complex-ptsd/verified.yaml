# v2.5 唯一编译事实源 (ADR-002)。由 cangjie.py compile 确定性编译 single/pack。
# 底本性质: 合法开放同主题权威底本 (SAMHSA TIP57 public domain + Pete Walker 官网授权公开原文)，非目标商业畅销书全文。
schema_version: 1
bundle_id: bundle.complex-ptsd
book:
  title: "Complex PTSD: From Surviving to Thriving"
  author: "Pete Walker"
  source_pack: "legal-open-substitute"
  baseline_tag: "SAMHSA-TIP57-2014 + pete-walker.com author-open-2026"

entry:
  name: complex-ptsd-repair
  description: >
    复杂性创伤后应激 (C-PTSD) 的识别与自助康复入口。覆盖 4F 防御类型 (战/逃/僵/讨好) 识别、
    情绪闪回 13 步当下化处置、毒性羞耻与内在批判者管理、解离与触发着陆、关系重演诊断、
    自伤自杀风险分流。所有能力均为自我理解与情绪调节向导，不替代精神科诊断与专业治疗。
  core_principles:
    - "先安全后加工：现实危险或自伤/自杀危机永远优先于任何自我安抚步骤。"
    - "去病理化：创伤反应是对异常经历的正常适应代价，不是性格缺陷。"
    - "躯体优先：情绪闪回先做身体着陆 (呼吸/肌肉/当下化)，再谈认知与关系内容。"
    - "4F 是倾向连续谱而非人格定罪；康复方向是恢复四型的灵活可及性。"
    - "小步慢恢复：two steps forward, one step back，不因一次闪回自我攻击。"
  out_of_scope:
    - "不做精神科诊断、不替代药物处方与面诊。"
    - "现实暴力/家暴进行中不建议自我安抚，立即转安全计划与紧急联络。"
    - "不把集体主义文化中的顾他/和谐取向病理化为 fawn 型。"
  stop_conditions:
    - "出现自伤/自杀意念、解离失控、物质中毒或精神科急症时，立即停止自助流程并转专业危机干预。"

router_entry:
  name: cptsd-source-router
  description: >
    Pete Walker《Complex PTSD》方法论来源路由：当用户报告情绪闪回、4F 防御模式、毒性羞耻、
    内在批判者攻击、关系重演、解离或自伤风险时，按症状路由到对应能力卡。

promotion_budget: 8

capabilities:
  - capability_id: cap.complex-ptsd.four-f-trauma-typology
    revision: 1
    status: active
    slug: four-f-trauma-typology
    title: "4F 创伤类型识别（战/逃/僵/讨好）与互补康复"
    importance: critical
    importance_rationale: >
      直接来自 Pete Walker 官网公开原书章节 (10_the_fourf_s_a_trauma_typology.txt L66-L80)；
      是整个创伤集群的核心识别能力——4F 决定后续闪回处置中哪一步加权 (fawn 加权边界/fight 加权自我暂停)。
      与 Waking the Tiger (躯体体验)、Polyvagal (迷走神经) 跨书互证。
    one_liner: "战/逃/僵/讨好 4F 是固定默认防御；康复方向是向互补极生长，不是消灭主型。"
    intents:
      - "识别自己或伴侣的创伤防御类型 (战/逃/僵/讨好)"
      - "冲突时总讨好息事宁人 / 停不下来忙碌 / 只想躲起来消失 / 必须压过对方才安心"
      - "理解共依赖/讨好型人格的创伤根源"
    keywords: [4F, fight, flight, freeze, fawn, 讨好型, 共依赖, codependency, 防御类型, trauma typology]
    also_read:
      - cap.complex-ptsd.emotional-flashback-13-steps
      - cap.complex-ptsd.relationship-reenactment
      - cap.complex-ptsd.avoidance-support-rebuild
      - cap.waking-the-tiger.biological-completion
      - cap.poly.autonomic-ladder
    card: cards/four-f-trauma-typology.md
    frontmatter:
      description: >
        当用户描述自己或伴侣在冲突/亲密中反复出现固定模式——讨好息事宁人 (fawn)、停不下来忙碌
        (flight)、退缩消失 (freeze)、必须占上风 (fight)——时使用。识别 4F 主导类型并指出互补康复方向。
        不用于贴人格障碍标签；不用于现实暴力关系中单方面建议反抗。
      tags: [cptsd, 4f, defense, typology, codependency, trauma]
    source_evidence:
