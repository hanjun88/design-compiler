- capability_id: cap.waking-the-tiger.biological-completion
  revision: 1
  status: active
  slug: biological-completion
  title: 完成被阻断的本能动作（完成未完成的动作）
  importance: critical
  importance_rationale: SE 与一般放松/正念的核心分野；把卡住的战逃动作在安全中补做完。
  one_liner: 识别身体想做却当年没做成的动作冲动，在安全里放慢把它做完，让身体收到'已完成'反馈。
  intents:
  - 反复出现想推/想跑/想护的身体冲动
  - 谈了很多仍卡在同一个身体紧
  keywords:
