  revision: 1
  status: active
  slug: freeze-third-response
  title: 僵住是第三种生存反应（去羞耻的生物学解释）
  importance: high
  importance_rationale: 把'我当时为什么不动'的自责重框为先天第三生存反应，是 SE 全部技术的认知入口。
  one_liner: 僵住不是懦弱，是战逃失效时的第三套保命程序，本应短暂、走完即释放。
  intents:
  - 解释创伤中僵住/动不了
  - 为闪回/解离去羞耻
  keywords:
  - freeze
  - immobility
  - 僵住
  - 冻结
  - tonic immobility
  - 第三生存反应
  also_read:
