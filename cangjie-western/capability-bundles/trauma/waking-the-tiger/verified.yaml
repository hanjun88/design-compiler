- capability_id: cap.waking-the-tiger.resourcing-first
  revision: 1
  status: active
  slug: resourcing-first
  title: 资源先行：先建立可退回的安全躯体锚
  importance: critical
  importance_rationale: SE 一切工作的前置稳定化步骤，直接决定是否会淹没；与着陆/最优唤醒窗衔接。
  one_liner: 碰创伤之前，先在身体里找到一个真的能感到安全的锚，并约定随时退回。
  intents:
  - 一碰创伤就崩溃
  - 做放松练习时突然翻涌
  - 需要情绪稳定化
  keywords:
  - resourcing
  - resource
  - 资源
  - 安全锚
  - grounding somatic anchor
  also_read:
  - cap.waking-the-tiger.titration
  - cap.complex-ptsd.ground-trigger-flashback
  - cap.complex-ptsd.optimal-arousal-window
  card: cards/resourcing-first.md
  confidence_band:
  - 0.65
  - 0.75
  is_actionable: true
  frontmatter:
    description: 在触碰创伤材料之前，引导对方（或自己）先找到一个当下就能在身体里感到的安全/舒适锚（脚底踩地、背的支撑、被安全拥住的温度），把它'长大'成可反复退回的资源，约定过载时退回。先稳后碰，防淹没。
    tags:
