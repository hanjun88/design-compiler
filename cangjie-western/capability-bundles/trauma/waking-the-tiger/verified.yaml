  slug: animal-release-cycle
  title: 动物自然释放观察：自愈是默认设置
  importance: medium
  importance_rationale: 提供'系统本会恢复'的生物学希望与'威胁+束缚才致病'的判据，是 SE 乐观假设的基础。
  one_liner: 野生动物遭遇威胁后会颤抖放电、回到基线；人卡住是因为动作被阻止，而非天生脆弱。
  intents:
