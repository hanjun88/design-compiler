  confidence_band:
  - 0.62
  - 0.72
  is_actionable: true
  frontmatter:
    description: 当人描述'当时整个人僵住、动不了、像死了一样'并自责时，用 Levine 的框架把僵住正常化为战逃失效时的第三种先天生存反应（freeze/装死），说明它本应短暂、卡住才致病。只做去羞耻与解释，不引导回到创伤场景。
