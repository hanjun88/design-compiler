  importance: high
  importance_rationale: SE 训练神经系统弹性的核心节奏技术，把容忍窗撑大。
  one_liner: 让注意力在一个轻微不适点和一个资源点之间来回摆，反复练习'能靠近也能退回'。
  intents:
