- capability_id: cap.waking-the-tiger.discharge-signs
  revision: 1
  status: active
  slug: discharge-signs
  title: 识别并允许放电信号：颤抖/打哈欠/流泪/长叹是自愈
  importance: high
  importance_rationale: 防止把自愈信号误判为恶化而压制，是完成动作后能否真正重置的关键。
  one_liner: 练习中出现颤抖、打哈欠、流泪、深长叹息时，那多是身体在放电，别压住，让它走完。
  intents:
  - 练习中开始发抖/哭/打哈欠并担心是不是变糟
  - 分不清释放信号和惊恐
  keywords:
  - discharge
  - 放电
  - 释放
  - trembling
  - yawning
  - tears
  - sigh
  - vooo
  also_read:
  - cap.waking-the-tiger.biological-completion
  - cap.waking-the-tiger.pendulation
  card: cards/discharge-signs.md
  confidence_band:
  - 0.62
  - 0.72
  is_actionable: true
  frontmatter:
    description: 在资源/摆动/完成动作过程中，识别自发放电信号——手脚轻颤、波浪式发热、打哈欠、流泪、深长叹息、呼吸变满——并把它正常化为神经系统在自我重置，鼓励它自然走完而非压制。若颤抖伴随恐慌加剧或解离则不是本情形，须回资源并就医。
    tags:
