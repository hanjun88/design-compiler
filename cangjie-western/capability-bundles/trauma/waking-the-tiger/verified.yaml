  card: cards/biological-completion.md
  confidence_band:
  - 0.63
  - 0.73
  is_actionable: true
  frontmatter:
    description: 在资源与滴定到位后，识别身体当年想做却被阻断的具体动作冲动（推、跑、护、躲），用放慢、可回退的想象与细微身体动作把它补做完，让本体感觉反馈通知自主神经'动作已完成'，从而交感撤防。不是情绪宣泄，也不是重新暴露于创伤记忆。
