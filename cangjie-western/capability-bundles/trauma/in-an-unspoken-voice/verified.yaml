  title: 未说出口的声音：先听身体的内感受
  importance: high
  importance_rationale: 确立'身体先于语言'的入口，是本书书名所指的核心转向。
  one_liner: 当道理讲不通，先把注意力放到身体此刻的感觉上，让未被翻译的信号被听见。
  intents:
  - 道理都懂但身体过不去
  - 脑内反刍停不下来
