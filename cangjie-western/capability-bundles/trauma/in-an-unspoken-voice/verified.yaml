  title: SIBAM 五通道碎片化：为什么身体在、意义不在
  importance: high
  importance_rationale: 解释'道理懂却疗愈不了'，并定位从感觉通道重接，连接 WT 的完成动作。
  one_liner: 体验分感觉/意象/行为/情感/意义五通道，创伤把它们撕裂；从还在的感觉通道重新接通。
  intents:
