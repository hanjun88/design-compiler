  is_actionable: true
  frontmatter:
    description: 用多迷走神经的三层级判断一个人当下的自主神经状态：腹侧迷走=安全/与人连接；交感=战逃动员（心跳呼吸升、想冲逃）；背侧迷走=关机/僵死/解离（瘫软、空、想消失）。先判状态再选对应工具，状态随安全信号秒变，需反复重判。
