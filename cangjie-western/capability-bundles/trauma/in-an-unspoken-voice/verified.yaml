- capability_id: cap.in-an-unspoken-voice.dorsal-vagus-immobility
  revision: 1
  status: active
  slug: dorsal-vagus-immobility
  title: 背侧迷走关机：区分安全的不动与病态僵死
  importance: high
  importance_rationale: 防止把关机误读为放松、或对关机者硬推活跃，是本书关键的临床分辨。
  one_liner: 关机(钝/空/瘫软)≠放松(软而温暖)；对关机者先延长呼气/发声温柔唤醒，别让他振作。
  intents:
  - 对方突然蔫了/空了
  - 分不清放松还是麻木
  - 叫人开心点反而更糟
  keywords:
  - dorsal vagal
  - shutdown
  - immobility
  - 解离
  - 关机
  - vooo
  - 延长呼气
  also_read:
  - cap.in-an-unspoken-voice.polyvagal-three-states-map
  - cap.waking-the-tiger.freeze-third-response
  - cap.complex-ptsd.detect-dissociation
  card: cards/dorsal-vagus-immobility.md
  confidence_band:
  - 0.6
  - 0.7
  is_actionable: true
  frontmatter:
    description: 区分两种'不动'：腹侧参与的安全不动（软、温暖、有连接、不恐惧）与背侧迷走主导的病态僵死/关机（瘫软、麻木、空、想消失）。对关机者不要喊他振作，而是用延长呼气、低沉发声、踩地与安全陪伴温柔唤醒，给极小剂量躯体输入。
    tags:
    - trauma
    - polyvagal
    - shutdown
    - dissociation
  source_evidence:
