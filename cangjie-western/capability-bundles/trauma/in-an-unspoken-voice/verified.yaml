  slug: polyvagal-three-states-map
  title: 多迷走三状态地图：先判断现在在哪个状态
  importance: critical
  importance_rationale: 本书理论核心；先判状态再选工具，是 SE 进阶临床判断的骨架。
  one_liner: 按腹侧迷走(安全连接)/交感(战逃)/背侧迷走(关机)判断当下状态，再选工具。
  intents:
  - 判断当下情绪/身体状态
  - 为什么人会突然熄火或想逃
  keywords:
  - polyvagal
  - ventral vagal
  - sympathetic
  - dorsal vagal
  - 多迷走
  - 三状态
  - neuroception
  also_read:
