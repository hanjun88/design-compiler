bundle_id: bundle.in-an-unspoken-voice
entry:
  name: in-an-unspoken-voice-entry
  description: 'In an Unspoken Voice: How the Body Releases Trauma and Restores Goodness
    方法论能力入口。覆盖先听身体的内感受、多迷走三状态地图、背侧迷走关机区分、创伤是断裂的连接与善性恢复、SIBAM 五通道碎片化、社群与仪式作为疗愈容器。所有能力均为自我理解与关系/情绪调节向导，不替代专业诊断与治疗。

    '
  core_principles:
  - 先安全后探索：现实危险或自伤/自杀危机永远优先于任何自我调节步骤。
  - 去病理化：心理/创伤反应是对经历的正常适应代价，不是性格缺陷。
  - 关系是过程不是标签：依恋风格/创伤反应是倾向连续谱，非终身判决。
  - 小步慢恢复：不因一次崩溃自我攻击，允许two steps forward one step back。
  out_of_scope:
  - 不做精神科诊断、不替代药物处方与面诊。
  - 现实暴力/家暴进行中不建议自我调节，立即转安全计划与紧急联络。
  - 不凭一次对话贴人格/依恋标签。
  stop_conditions:
  - 出现自伤/自杀意念、解离失控、现实暴力威胁或精神科急症时，立即停止自助流程并转专业危机干预。
