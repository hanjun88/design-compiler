  card: cards/unspoken-voice-interoception.md
  confidence_band:
  - 0.62
  - 0.72
  is_actionable: true
  frontmatter:
    description: 当人陷入脑内反刍、说'道理都懂但身体过不去'时，引导把注意力从'想通故事'转到当下身体的感觉上，先命名一个身体感觉（紧/沉/热/空），不急于解读，让身体这个'未说出口的声音'先被听见。先正性躯体标记，再靠近不适。
