    one_liner: "焦虑型依恋系统被分离信号激活时，用放大问题/放大负性情绪/连环消息/威胁分手来逼对方回应——这是抗议行为，不是事实。"
    intents: ["他两小时没回消息我就慌", "我为什么总忍不住打电话", "How do I stop panic-texting"]
