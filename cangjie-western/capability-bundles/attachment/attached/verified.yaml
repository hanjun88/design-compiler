schema_version: "1"
bundle_id: bundle.attached

entry:
  name: attached-entry
  description: >
    Attached: The New Science of Adult Attachment
    方法论能力入口。覆盖焦虑×回避双维度依恋地图、内部工作模型(IWM)、焦虑型激活策略(抗议行为)、回避型去激活策略、分离焦虑传导链、依恋×共情机制、关系正念缓冲器。所有能力均为自我理解与关系/情绪调节向导，不替代专业诊断与治疗。
  core_principles:
    - "先安全后探索：现实危险或自伤/自杀危机永远优先于任何自我调节步骤。"
    - "去病理化：心理/创伤反应是对经历的正常适应代价，不是性格缺陷。"
    - "关系是过程不是标签：依恋风格/创伤反应是倾向连续谱，非终身判决。"
    - "小步慢恢复：不因一次崩溃自我攻击，允许two steps forward one step back。"
  out_of_scope:
    - "不做精神科诊断、不替代药物处方与面诊。"
    - "现实暴力/家暴进行中不建议自我调节，立即转安全计划与紧急联络。"
    - "不凭一次对话贴人格/依恋标签。"
  stop_conditions:
    - "出现自伤/自杀意念、解离失控、现实暴力威胁或精神科急症时，立即停止自助流程并转专业危机干预。"

router_entry:
  name: attached-source-router
  description: >
    Amir Levine & Rachel S. F. Heller《Attached: The New Science of
    Adult
    Attachment》方法论来源路由：当用户报告伴侣不回消息就慌（焦虑激活）、对方一哭就想消失（回避去激活）、总选错人、追逃循环或关系不安全感时，按症状/问题路由到对应能力卡。

