# Capability Bundle — attachment-in-psychotherapy (Wallin)
schema_version: "1"
bundle_id: bundle.attachment-in-psychotherapy

entry:
  name: attachment-in-psychotherapy-entry
  description: >
    Attachment in Psychotherapy
    方法论能力入口。覆盖治疗师作为安全基地五任务、成人依恋策略量体裁衣、心智化/反思功能培育、自传体叙事连贯度、破裂与修复循环、移情即
    IWM 重演、未解决创伤/丧失转介红线。所有能力均为自我理解与关系/情绪调节向导，不替代专业诊断与治疗。
  core_principles:
    - "先安全后探索：现实危险或自伤/自杀危机永远优先于任何自我调节步骤。"
    - "去病理化：心理/创伤反应是对经历的正常适应代价，不是性格缺陷。"
    - "关系是过程不是标签：依恋风格/创伤反应是倾向连续谱，非终身判决。"
    - "小步慢恢复：不因一次崩溃自我攻击，允许two steps forward one step back。"
  out_of_scope:
    - "不做精神科诊断、不替代药物处方与面诊。"
    - "现实暴力/家暴进行中不建议自我调节，立即转安全计划与紧急联络。"
    - "不凭一次对话贴人格/依恋标签。"
  stop_conditions:
    - "出现自伤/自杀意念、解离失控、现实暴力威胁或精神科急症时，立即停止自助流程并转专业危机干预。"

router_entry:
  name: attachment-in-psychotherapy-source-router
  description: >
    David J. Wallin《Attachment in
    Psychotherapy》方法论来源路由：当心理学习者理解依恋治疗结构、区分焦虑/回避干预方向、提升共情与心智化、吵架后修复关系，或出现解离/闪回/自杀信号时，按症状/问题路由到对应能力卡。

