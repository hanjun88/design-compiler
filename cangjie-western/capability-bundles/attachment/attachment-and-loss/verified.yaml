  - capability_id: cap.attachment-and-loss.abcd-pattern-recognition
    revision: 1
    status: active
    slug: abcd-pattern-recognition
    title: ABCD 依恋四模式识别
    importance: critical
    importance_rationale: 集群最高频诊断需求；跨 Attached/Hold Me Tight/Wired for Love 的共同上游
    one_liner: 安全/回避(去激活)/矛盾(过度激活)/失序(无组织) 四策略，按压力下行为判倾向
    intents: [判断依恋类型, 区分焦虑型回避型, 追逃循环]
    keywords: [ABCD, secure, avoidant, ambivalent, disorganized, attachment style, 焦虑型, 回避型]
    also_read: [cap.attachment-and-loss.internal-working-model, cap.attachment-in-psychotherapy.adult-strategy-matching]
    card: cards/abcd-pattern-recognition.md
    frontmatter:
      description: 用户想知道自己/伴侣的依恋类型，或问"为什么我越爱越追/越爱越躲"时使用。按压力-分离-重聚行为判倾向（去激活/过度激活/失序）。这是倾向假设非终身标签；不能凭此反推虐待；D/unresolved 信号转创伤评估。
      tags: [attachment, classification, diagnosis-lite]
    source_evidence:
