  - capability_id: cap.attachment-and-loss.mourning-four-phases-adult
    revision: 1
    status: active
    slug: mourning-four-phases-adult
    title: 成人哀悼四阶段定位
    importance: high
    importance_rationale: 丧亲正常化；防止误把正常哀伤病理化
    one_liner: 麻木-震惊/思念-搜寻/失序-绝望/重组；重叠可往返，非线性必经
    intents: [丧亲情绪正常化, 解释哀悼阶段, 周年反应]
    keywords: [mourning phases, grief, Bowlby Parkes, 哀悼, 悲伤, 走不出来]
    also_read: [cap.attachment-and-loss.complicated-grief-differential, cap.attachment-and-loss.separation-three-phases-child]
