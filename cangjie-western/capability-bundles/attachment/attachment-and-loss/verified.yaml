    frontmatter:
      description: 亲人去世数周-数月后用户描述情绪、问"我是不是不正常"、周年忌日触发悲伤时使用。按四相位定位并正常化重叠/往返。不催"走出来"；若症状时长/功能/自杀命中红线转 complicated-grief-differential。
