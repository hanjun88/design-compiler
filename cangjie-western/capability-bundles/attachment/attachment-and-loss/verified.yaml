    one_liner: 早期照料编译成"自我是否值得被回应×他人是否可靠"的自动脚本，成年后自证预言
    intents: [理解关系重复, 解释自证预言, 原生家庭影响]
    keywords: [internal working model, IWM, self-fulfilling prophecy, 内部工作模型, 关系重复]
