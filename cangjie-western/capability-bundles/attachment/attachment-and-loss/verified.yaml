  - capability_id: cap.attachment-and-loss.secure-base-haven-function
    revision: 1
    status: active
    slug: secure-base-haven-function
    title: 安全基地×安全港 关系支持质量评估
    importance: high
    importance_rationale: Bowlby 自称最核心概念；跨书临床/自助共用
    one_liner: 一段支持性关系=遇险能被接住(安全港)+被安抚后敢探索(安全基地)
    intents: [评估关系健康度, 理解安全关系, 伴侣/治疗/友谊评估]
    keywords: [secure base, safe haven, 安全基地, 安全港, relationship quality]
    also_read: [cap.attachment-and-loss.attachment-system-activation, cap.attachment-in-psychotherapy.therapist-secure-base]
    card: cards/secure-base-haven-function.md
    frontmatter:
      description: 用户想评估一段关系是否健康的支持、问"为什么我在这段关系里越来越没自信"时使用。用安全港(需要时被接住)×安全基地(敢探索)两轴评估。不劝分；关系有暴力/恐吓时优先人身安全。
      tags: [attachment, relationship-assessment]
    source_evidence:
