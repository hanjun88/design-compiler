        license: NICE public
    is_actionable: true
    confidence: 0.7
    promotion: { destination: promoted }

  - capability_id: cap.attachment-and-loss.separation-three-phases-child
    revision: 1
    status: active
    slug: separation-three-phases-child
    title: 儿童分离三阶段 protest/despair/detachment
    importance: medium
    importance_rationale: 儿童入园/分离场景；误把 detachment 当"适应"是常见风险
    one_liner: 儿童分离经抗议→绝望→疏离；突然不哭了常是防御而非恢复
    intents: [理解儿童分离焦虑, 入园适应, 成人分手阶段类比]
    keywords: [protest despair detachment, separation anxiety, 分离焦虑, 入园, 儿童哀悼]
    also_read: [cap.attachment-and-loss.mourning-four-phases-adult]
    card: cards/separation-three-phases-child.md
    frontmatter:
      description: 家长/老师问幼儿分离焦虑、入园适应，或用户描述成人分手断联阶段感受时使用。按时间轴定位 protest/despair/detachment；detachment 不等于好了。<6月婴儿不适用。儿童出现 Bowlby 危险信号转专业。
      tags: [attachment, child-development, grief]
    source_evidence:
