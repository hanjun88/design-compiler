  - capability_id: cap.attachment-and-loss.complicated-grief-differential
    revision: 1
    status: active
    slug: complicated-grief-differential
    title: 正常哀悼 vs 复杂性哀伤 区分与转介
    importance: critical
    importance_rationale: 安全红线；漏诊 PGD/自杀风险后果严重
    one_liner: 时长≥6-12月+持续思念无法接受+功能损害+自杀风险=转介，不自助安慰
    intents: [判断是否病理性哀伤, 丧亲自杀风险筛查, 转介]
    keywords: [complicated grief, PGD, prolonged grief, 复杂哀伤, 延长哀伤, 丧亲自杀]
    also_read: [cap.attachment-and-loss.mourning-four-phases-adult, cap.attachment-in-psychotherapy.unresolved-trauma-referral]
    card: cards/complicated-grief-differential.md
    frontmatter:
      description: 丧亲数月后仍极度痛苦、问"我是不是病了"、有自杀念头时使用。按时长(≥6/12月)、核心症状、功能损害、自杀风险四维分层；命中红线立即建议精神科/急诊/危机热线。不诊断、不提供疗法。
