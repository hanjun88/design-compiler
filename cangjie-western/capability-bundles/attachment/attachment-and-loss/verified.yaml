capabilities:
  - capability_id: cap.attachment-and-loss.attachment-system-activation
    revision: 1
    status: active
    slug: attachment-system-activation
    title: 依恋系统激活—去激活识别
    importance: critical
    importance_rationale: 集群最基础识别；误把激活当"作"是关系冲突的首要误判
    one_liner: 威胁/分离时朝向某人的亲近寻求=依恋系统激活，要联结确认而非问题解决
    intents: [识别分离焦虑, 解释粘人/查岗, 判断依恋通道]
    keywords: [attachment system, proximity-seeking, separation anxiety, 依恋系统, 分离激活, clingy]
    also_read: [cap.attachment-and-loss.internal-working-model, cap.attachment-in-psychotherapy.therapist-secure-base]
    card: cards/attachment-system-activation.md
    frontmatter:
      description: 当用户在分离/出差/争吵后描述突然的联系渴望、查岗、恐慌，或困惑自己"明明没事却非要打电话"时使用。识别这是依恋系统被激活、需要联结确认，而非"作"。不适用于慢性嫉妒/跟踪/暴力（须独立风险评估）。不做诊断。
      tags: [attachment, affect-regulation, identification]
    source_evidence:
