# 证据法: 合法开放同主题权威底本, 非 de Fouw/Svoboda 原著付费内容; 象征层只读
schema_version: "1"
bundle_id: bundle.light-on-life

entry:
  name: light-on-life-entry
  description: >
    Light on Life: Vedic Astrology for Modern Times 方法论能力入口。覆盖恒星黄道与
    Lahiri 岁差、九曜心理原型、二十七宿潜意识动机、Yoga 人格配置、D9 Navamsha 内在真实自我、Ashtakoota
    合婚对话清单。所有能力均为自我理解与关系/情绪调节向导，不替代专业诊断与治疗。
  core_principles:
    - "星盘是心理能量的成长地图（潜能与张力的地形图），不是命运判决书。"
    - "非决定论：占星提供自我反思象征语言，不预测具体事件或日期。"
    - "象征层只读：识别'注定/必然'式决定论滑落，把叙述改写为'这是哪片心理地形'。"
    - "危机让位：出现心理危机信号时立即停止象征层反思并转专业评估。"
  out_of_scope:
    - "不做命运预测、不预测具体事件或日期。"
    - "不替代专业医疗/心理评估与治疗。"
    - "不拿星盘标签当未探索的'早闭'牢笼。"
  stop_conditions:
    - "因星盘预测产生强烈恐惧/反刍/焦虑影响日常功能时，停止占星反思并转心理健康专业评估。"

