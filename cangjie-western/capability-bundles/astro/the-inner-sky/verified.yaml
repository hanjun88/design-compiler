schema_version: 1
bundle_id: bundle.the-inner-sky
book:
  title: The Inner Sky
  author: Steven Forrest
  source_pack: forrest-inner-sky
  baseline_tag: 2007-revised
  substitute_notice: 合法开放同主题权威底本，非目标商业畅销书原文
entry:
  name: the-inner-sky
  description: 心理占星入门：把出生图当作心理蓝图的反思框架。行星=心理驱力、星座=待养成的美德、宫位=课堂。本入口提供非决定论伦理、原始三元组优先法、行星×星座×宫位合成语法。适用于想从太阳星座娱乐化走向严肃自我反思的用户；不适用于事件预测、人格测量或心理诊断。
  core_principles:
    - 出生图是对你个人最充实人生的描述，不是命运判决书
    - 行星=心理驱力，星座=待养成美德，宫位=练习课堂，三者合读
    - 先抓 Sun/Moon/Asc 原始三元组（1728 种组合），再叠加其他行星
    - 外行星星座位=世代主题，宫位与相位才是个人化
    - 占星提醒你是谁，之后决定权在你
  out_of_scope:
    - 预测具体事件（结婚/离婚/疾病/财富）
    - 把星座当固定性格标签
    - 处理心理创伤或临床问题
    - 与 vedic/印度占星体系混编
  stop_conditions:
    - 用户要求事件预测时立即拒绝并转向镜像反射
    - 用户出现自伤/危机信号时象征层让位临床通道
router_entry:
  name: the-inner-sky
  description: Steven Forrest《The Inner Sky》心理占星蒸馏。把出生图读作心理蓝图：行星是心理驱力，星座是待养成的美德，宫位是练习课堂。适用于想严肃理解自己出生图、从太阳星座娱乐化走向自我反思的用户。不预测事件，不做人格诊断。
