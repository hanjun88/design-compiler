        当用户给出"某行星在某星座某宫位"并问含义时使用。Forrest 合成语法：行星=驱力(what)，星座=待养成美德(how)，宫位=课堂(where)。输出"你在用[how]方式，在[where]领域，练习[what]驱力"一句话+阴影面。缺宫位说明需出生时间。不用于单一符号定义问题。
