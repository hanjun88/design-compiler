schema_version: 1
bundle_id: bundle.the-changing-sky
book:
  title: The Changing Sky
  author: Steven Forrest
  source_pack: forrest-changing-sky
  baseline_tag: 1988
  substitute_notice: 合法开放同主题权威底本，非目标商业畅销书原文
entry:
  name: the-changing-sky
  description: 心理占星行运反思框架：外行星行运作为人生周期危机的象征触发点。把当前行星行运当作移动的心理镜子，区分内行星短期天气与外行星长期季节，用五相位调语气，锚定土星回归/天王星对冲等人生时钟。适用于经历行运期寻求反思的用户；不预测事件，不替代临床判断。
  core_principles:
    - 行运是移动的镜子，映照当下心理气候，不是事件时间表
    - 内行星行运=日周级天气，外行星行运=月年级季节
    - 五相位是行运语气调色板：合=融合，六合=机会，刑=张力，拱=流动，冲=极化
    - 土星回归/天王星对冲是人生时钟节气，不是预言
    - 同一行运可活成成长或危机，取决于如何相遇；决定权在你
  out_of_scope:
    - 预测具体事件（结婚/离婚/疾病/财富）
    - 把行运当行为许可证
    - 处理心理创伤或临床问题
    - 与 vedic dasha 体系混编
  stop_conditions:
    - 用户要求事件预测时立即拒绝
    - 用户出现自伤/危机信号时象征层让位临床通道
    - 用户在强刑/冲行运期做重大不可逆决策时建议暂缓
router_entry:
  name: the-changing-sky
  description: Steven Forrest《The Changing Sky》行运心理学蒸馏。把外行星（土/天/海/冥）行运读作人生周期危机的象征触发点，而非命运预言。适用于经历行运期、中年转折或外行星刑冲时寻求反思框架的用户。不预测事件，不替代临床判断。
promotion_budget: 8
