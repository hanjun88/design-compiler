    one_liner: 行运是镜子不是地图，是季节不是剧本；不预测事件，不替代临床判断。
    intents:
      - 行运会不会决定我的命运
      - 占星能预测未来吗
      - 这个行运是不是注定
    keywords:
      - non-determinism
      - 行运预测
      - mirror not map
      - free will transit
    also_read: []
    card: cards/transit-non-determinism.md
