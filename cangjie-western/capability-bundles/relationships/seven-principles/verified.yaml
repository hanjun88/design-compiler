  card: cards/thermostat-ratio.md
  frontmatter:
    description: 每段关系有连接恒温器：过热=冲突升级（四骑士），过冷=情感抽离。Gottman 5:1 魔法比率——每次负性互动需要至少 5 次正性互动缓冲。识别自己的燃烧点/冻结点，用温度语言（'我热了/我冷了'）+暂停+重连仪式把温度拉回区间。
