- capability_id: cap.why-does-he-do-that.myth-of-change
  revision: 1
  status: active
  slug: myth-of-change
  title: 「改变的神话」识别
  importance: critical
  importance_rationale: 受害者最常被"他会改"困住；不识别这个神话就会无限延长危险关系。
  one_liner: 道歉与普通咨询不构成改变证据；真正改变需长期施暴者干预项目+不怪她+稳定行为。
  intents:
  - 他会改吗
  - 他道歉了是不是该给他机会
  - 他在做心理咨询
  keywords:
  - myth of change
  - promises
  - apology
  - batterer intervention
  - 改变的神话
  - 他会改
  - 道歉
  also_read:
