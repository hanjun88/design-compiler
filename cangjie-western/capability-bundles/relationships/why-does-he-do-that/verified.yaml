- capability_id: cap.why-does-he-do-that.entitlement-control
  revision: 1
  status: active
  slug: entitlement-control
  title: 权利感与控制欲解构
  importance: critical
  importance_rationale: 虐待的内核不是心理疾病而是被社会化植入的权利感；不解构它就会回到"我哪里不好"。
  one_liner: 施虐不是病，是被训练成"女性存在为服务他"的权利感。
  intents:
  - 他凭什么管我
  - 为什么觉得他可以决定我的一切
  - 他为什么控制我
  keywords:
  - entitlement
  - control
  - ownership
  - misogyny
  - 权利感
  - 控制欲
  - 他凭什么
  also_read:
  - cap.why-does-he-do-that.blame-shift-detect
  - cap.why-does-he-do-that.abuser-typing
  - cap.why-does-he-do-that.economic-control
  card: cards/entitlement-control.md
  frontmatter:
    description: Bancroft 核心论点：施虐是从男性榜样与社会厌女文化中学来的权利感，不是心理创伤。他真心相信女性的存在是为了服务他——性、家务、顺从。把'他为什么这样对我'从'我哪里不好'改写为'他被训练成相信他有权这样对我'。
    tags:
    - entitlement
    - coercive-control
    - misogyny
    - ideology
