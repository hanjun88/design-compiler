bundle_id: bundle.why-does-he-do-that
entry:
  name: why-does-he-do-that-entry
  description: 'Why Does He Do That? Inside the Minds of Angry and Controlling Men
    方法论能力入口。覆盖致命危险评估与安全计划、被困结构识别、归罪转移检测、严重度信任(反Gaslighting)、打破隔离重建联结、权利感与控制欲解构、改变的神话、施虐者类型学、经济控制与脱困钥匙。所有能力均为自我理解与关系/情绪调节向导，不替代专业诊断与治疗。

    '
  core_principles:
  - 先安全后探索：现实危险或自伤/自杀危机永远优先于任何自我调节步骤。
  - 去病理化：心理/创伤反应是对经历的正常适应代价，不是性格缺陷。
  - 关系是过程不是标签：依恋风格/创伤反应是倾向连续谱，非终身判决。
  - 小步慢恢复：不因一次崩溃自我攻击，允许two steps forward one step back。
  out_of_scope:
  - 不做精神科诊断、不替代药物处方与面诊。
  - 现实暴力/家暴进行中不建议自我调节，立即转安全计划与紧急联络。
  - 不凭一次对话贴人格/依恋标签。
  stop_conditions:
  - 出现自伤/自杀意念、解离失控、现实暴力威胁或精神科急症时，立即停止自助流程并转专业危机干预。
router_entry:
  name: why-does-he-do-that-source-router
  description: 'Lundy Bancroft《Why Does He Do That? Inside the Minds of Angry and
    Controlling Men》方法论来源路由：当用户报告伴侣控制/恐吓、被说''都是你的错''、质疑''他会改吗''、没有自己的钱、或支持者不知如何帮助受困者时，按症状/问题路由到对应能力卡。

    '
