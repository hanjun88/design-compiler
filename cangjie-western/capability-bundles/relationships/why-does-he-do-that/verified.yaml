  - cap.why-does-he-do-that.entitlement-control
  card: cards/blame-shift-detect.md
  frontmatter:
    description: 施虐者整体致力于把'是你的错'打进受害者内心。事实：受害者做的任何事都无法让他对她更好，虐待完全来自施虐者内部。支持者用'你没有任何——零——原因造成他的行为；他
