  title: 施虐者类型学：Abuser vs Narcissist
  importance: high
  importance_rationale: 流行语把所有施虐者叫"自恋者"，Bancroft 反对；类型学帮受害者从"诊断他"回到"我该怎么办"。
  one_liner: 多数施虐者不是自恋者；标签不改变行动，别花时间查"他是什么人格"。
  intents:
