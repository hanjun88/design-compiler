  - cap.why-does-he-do-that.abuser-typing
  card: cards/myth-of-change.md
  frontmatter:
    description: Bancroft：施虐者极少改变。道歉、承诺、普通心理咨询都不构成改变证据。真正改变需要长期专门施暴者干预项目、他主动承认控制行为且不怪她、数年稳定行为。不把安全押在'他可能会改'上。与
      Gottman 七原则形成对照——沟通修复不适用于控制关系。
